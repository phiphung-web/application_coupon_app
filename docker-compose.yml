version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coupon_db_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coupon_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Định nghĩa volume để dữ liệu không bị mất khi tắt container
volumes:
  postgres_data: